<!doctype html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Face Wake Monitor v2</title>
	<script src="https://unpkg.com/ml5@0.12.2/dist/ml5.min.js"></script>
	<style>
		:root {
			color-scheme: dark;
			--background: #10161d;
			--panel: #18232d;
			--border: #334554;
			--text: #edf4f7;
			--muted: #9eb0ba;
			--awake: #6ee7b7;
			--sleeping: #f9a8d4;
		}

		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			padding: 32px 18px;
			color: var(--text);
			background: radial-gradient(circle at top left, #213744, var(--background) 52%);
			font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
		}

		main { width: min(960px, 100%); margin: 0 auto; }
		header { margin-bottom: 22px; }
		.eyebrow { margin: 0 0 8px; color: var(--awake); font-size: .78rem; font-weight: 700; letter-spacing: .14em; }
		h1 { margin: 0; font-size: clamp(2rem, 6vw, 4rem); line-height: 1; }
		.intro { margin: 14px 0 0; color: var(--muted); }
		.monitor { overflow: hidden; border: 1px solid var(--border); border-radius: 12px; background: var(--panel); box-shadow: 0 20px 60px #0005; }
		.stage { position: relative; aspect-ratio: 4 / 3; min-height: 260px; background: #080c10; }
		video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); }
		canvas { pointer-events: none; }
		.guide { position: absolute; inset: 0 0 50%; border-bottom: 1px dashed #ffffff55; pointer-events: none; }
		.guide span { position: absolute; right: 14px; bottom: 8px; color: #ffffff99; font-size: .75rem; }
		.status { padding: 22px; border-top: 1px solid var(--border); }
		.status-label { margin: 0 0 5px; color: var(--muted); font-size: .82rem; }
		#message { margin: 0; color: var(--awake); font-size: clamp(1.5rem, 4vw, 2.6rem); font-weight: 800; }
		#message.sleeping { color: var(--sleeping); }
		.controls { display: flex; align-items: center; gap: 14px; margin-top: 18px; }
		button { padding: 12px 22px; border: 0; border-radius: 7px; color: #092019; background: var(--awake); font: inherit; font-weight: 800; cursor: pointer; }
		button:disabled { cursor: wait; opacity: .6; }
		#detail { color: var(--muted); font-size: .9rem; }
		.error { color: #fca5a5 !important; }
		.build { margin-top: 10px; color: #64748b; font-size: .75rem; }
	</style>
</head>
<body>
	<main>
		<header>
			<p class="eyebrow">ML5 / FACE MONITOR</p>
			<h1>깨어있나요?</h1>
			<p class="intro">코의 위치를 기준으로 화면 중앙보다 아래에 있으면 수면 상태로 표시합니다.</p>
		</header>

		<section class="monitor" aria-label="얼굴 상태 모니터">
			<div class="stage" id="stage">
				<!-- width/height 속성이 반드시 있어야 합니다. ml5 가 이 값으로 좌표를 리사이즈합니다. -->
				<video id="video" width="640" height="480" autoplay muted playsinline></video>
				<canvas id="overlay" width="640" height="480"></canvas>
				<div class="guide"><span>화면 중앙 기준선</span></div>
			</div>
			<div class="status">
				<p class="status-label">현재 상태</p>
				<p id="message">시작 버튼을 눌러주세요.</p>
				<div class="controls">
					<button id="startButton" type="button">START</button>
					<span id="detail">카메라 권한이 필요합니다.</span>
				</div>
				<p class="build">build: v2 — 콘솔에 "FaceWakeMonitor v2" 가 보이면 최신 파일입니다.</p>
			</div>
		</section>
	</main>

	<script>
		console.log('FaceWakeMonitor v2 loaded');

		const video = document.getElementById('video');
		const stage = document.getElementById('stage');
		const canvas = document.getElementById('overlay');
		const context = canvas.getContext('2d');
		const message = document.getElementById('message');
		const detail = document.getElementById('detail');
		const startButton = document.getElementById('startButton');
		let faceModel;

		function setStatus(text, isSleeping = false) {
			message.textContent = text;
			message.classList.toggle('sleeping', isSleeping);
		}

		// ml5 는 결과를 video.width / video.height 로 리사이즈합니다.
		// 이 값이 0 이면 face-api 가 "resizeResults - invalid dimensions" 를 던지므로
		// 매 프레임 직전에 방어적으로 다시 맞춰 줍니다.
		function syncSize() {
			const w = video.videoWidth || 640;
			const h = video.videoHeight || 480;
			if (video.width !== w) video.width = w;
			if (video.height !== h) video.height = h;
			if (canvas.width !== w) canvas.width = w;
			if (canvas.height !== h) canvas.height = h;
			stage.style.aspectRatio = w + ' / ' + h;
			return { w, h };
		}

		function drawFace(face) {
			const nose = face.parts.nose[3];
			context.clearRect(0, 0, canvas.width, canvas.height);
			context.fillStyle = '#6ee7b7';
			context.beginPath();
			context.arc(nose.x, nose.y, 8, 0, Math.PI * 2);
			context.fill();
			return nose.y;
		}

		function detect() {
			const { h } = syncSize();
			faceModel.detect((error, results) => {
				if (error) {
					console.error('ml5 face detection error:', error, 'video.width =', video.width, 'video.height =', video.height);
					detail.textContent = '오류: ' + (error.message || error);
					setTimeout(detect, 500);
					return;
				}
				if (!results || results.length === 0) {
					context.clearRect(0, 0, canvas.width, canvas.height);
					setStatus('얼굴을 찾고 있습니다.');
				} else {
					const noseY = drawFace(results[0]);
					const centerY = h / 2;
					const isSleeping = noseY > centerY;
					setStatus(isSleeping ? '자고 있습니다.' : '깨어있습니다.', isSleeping);
					detail.textContent = '코 위치: ' + Math.round(noseY) + ' / 중앙: ' + Math.round(centerY);
				}
				requestAnimationFrame(detect);
			});
		}

		function loadFaceModel() {
			return new Promise((resolve, reject) => {
				faceModel = ml5.faceApi(
					video,
					{ withLandmarks: true, withDescriptors: false, minConfidence: 0.5 },
					(error) => (error ? reject(error) : resolve())
				);
			});
		}

		async function startMonitoring() {
			startButton.disabled = true;
			message.classList.remove('error');
			setStatus('카메라를 준비하고 있습니다.');
			try {
				const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
				video.srcObject = stream;
				await video.play();
				if (!video.videoWidth || !video.videoHeight) {
					await new Promise((resolve) => video.addEventListener('loadedmetadata', resolve, { once: true }));
				}
				const size = syncSize();
				console.log('camera size', video.videoWidth, video.videoHeight, '-> video.width', video.width, video.height);

				detail.textContent = '얼굴 인식 모델을 불러오는 중입니다.';
				await loadFaceModel();
				detail.textContent = '얼굴 인식 중 (' + size.w + 'x' + size.h + ')';
				detect();
			} catch (error) {
				console.error(error);
				setStatus('시작할 수 없습니다.');
				message.classList.add('error');
				detail.textContent = (error && error.message) || 'HTTPS 또는 localhost 에서 카메라 권한을 허용해 주세요.';
				startButton.disabled = false;
			}
		}

		startButton.addEventListener('click', startMonitoring);
	</script>
</body>
</html>
