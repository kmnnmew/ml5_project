<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>코 위치로 보는 수면 감지</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"></script>
<script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
<style>
  :root{
    --night:#161335;
    --night-2:#221d4d;
    --moon:#EFE7DA;
    --moon-dim:#9b93b8;
    --awake:#F3B23C;
    --asleep:#7E6FD0;
    --line:rgba(239,231,218,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1100px 600px at 78% -10%, #2c2566 0%, transparent 60%),
      var(--night);
    color:var(--moon);
    font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",-apple-system,"Segoe UI",sans-serif;
    display:flex;justify-content:center;
    padding:40px 20px 60px;
  }
  .wrap{width:100%;max-width:880px}

  header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:26px}
  h1{font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0}
  header p{margin:0;color:var(--moon-dim);font-size:14px;line-height:1.6}

  .stage{
    display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:22px;align-items:start;
  }
  .screen{
    position:relative;border-radius:14px;overflow:hidden;
    background:#0e0b24;border:1px solid var(--line);
    aspect-ratio:4/3;
  }
  .screen canvas{display:block;width:100%!important;height:100%!important}
  .veil{
    position:absolute;inset:0;display:grid;place-content:center;text-align:center;
    gap:8px;background:#0e0b24;color:var(--moon-dim);font-size:14px;line-height:1.7;padding:24px;
  }
  .veil[hidden]{display:none}

  .panel{display:flex;flex-direction:column;gap:16px}
  .readout{
    border:1px solid var(--line);border-radius:14px;padding:22px 20px;
    background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0));
  }
  .readout .state{font-size:27px;font-weight:600;letter-spacing:-.03em;margin:0 0 6px}
  .readout .why{margin:0;font-size:13px;color:var(--moon-dim);line-height:1.6}
  .readout.is-awake{border-color:rgba(243,178,60,.45)}
  .readout.is-awake .state{color:var(--awake)}
  .readout.is-asleep{border-color:rgba(126,111,208,.5)}
  .readout.is-asleep .state{color:var(--asleep)}

  .meter{display:flex;gap:12px;align-items:center;font-size:12px;color:var(--moon-dim)}
  .meter .bar{position:relative;flex:1;height:96px;border-radius:8px;border:1px solid var(--line);
    background:linear-gradient(180deg,rgba(243,178,60,.16),rgba(126,111,208,.18))}
  .meter .mid{position:absolute;left:0;right:0;top:50%;border-top:1px dashed rgba(239,231,218,.35)}
  .meter .dot{position:absolute;left:50%;width:11px;height:11px;margin:-6px 0 0 -6px;border-radius:50%;
    background:var(--moon);top:50%;transition:top .08s linear}

  button{
    font:inherit;font-weight:600;color:#1a1636;background:var(--moon);
    border:0;border-radius:10px;padding:13px 18px;cursor:pointer;width:100%;
  }
  button:hover{background:#fff}
  button:disabled{background:#3a3466;color:#8d86ad;cursor:not-allowed}
  button:focus-visible{outline:2px solid var(--awake);outline-offset:3px}
  .ghost{background:transparent;color:var(--moon-dim);border:1px solid var(--line)}
  .ghost:hover{background:rgba(255,255,255,.05);color:var(--moon)}

  footer{margin-top:26px;font-size:13px;color:var(--moon-dim);line-height:1.8}
  code{background:rgba(255,255,255,.07);padding:1px 6px;border-radius:5px;font-size:12px}

  @media (max-width:720px){ .stage{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>코 끝으로 보는 수면 감지</h1>
    <p>코가 화면 중앙선보다 내려가면 자고 있는 것으로 봅니다.</p>
  </header>

  <div class="stage">
    <div class="screen">
      <div id="holder"></div>
      <div class="veil" id="veil">
        <div>웹캠을 준비하는 중입니다.</div>
        <div>브라우저가 카메라 권한을 물어보면 허용해 주세요.</div>
      </div>
    </div>

    <div class="panel">
      <div class="readout" id="readout">
        <p class="state" id="state">대기 중</p>
        <p class="why" id="why">start를 누르면 얼굴을 찾기 시작합니다.</p>
      </div>

      <div class="meter">
        <div class="bar"><div class="mid"></div><div class="dot" id="dot"></div></div>
        <div>위: 깨어있음<br><br>아래: 자고 있음</div>
      </div>

      <button id="startBtn" disabled>start</button>
      <button id="stopBtn" class="ghost" disabled>멈추기</button>
    </div>
  </div>

  <footer>
    판정 기준은 코 끝 좌표(MediaPipe FaceMesh <code>keypoints[1]</code>)의 y값입니다.
    중앙선 위아래 <code>12px</code>는 판정을 유지하는 구간이라, 경계에서 글자가 떨리지 않습니다.
  </footer>
</div>

<script>
const W = 640, H = 480;
const DEAD_ZONE = 12;        // 중앙선 주변에서 상태를 유지하는 폭(px)
const NOSE_TIP = 1;          // FaceMesh 코 끝 인덱스

let faceMesh, video, faces = [];
let running = false;
let state = "idle";          // idle | searching | awake | asleep
let noseY = null;

const $state   = document.getElementById("state");
const $why     = document.getElementById("why");
const $readout = document.getElementById("readout");
const $dot     = document.getElementById("dot");
const $veil    = document.getElementById("veil");
const $start   = document.getElementById("startBtn");
const $stop    = document.getElementById("stopBtn");

function preload() {
  faceMesh = ml5.faceMesh({ maxFaces: 1, refineLandmarks: false, flipped: false });
}

function setup() {
  const cnv = createCanvas(W, H);
  cnv.parent("holder");
  pixelDensity(1);

  video = createCapture(VIDEO, () => {
    $veil.hidden = true;
    $start.disabled = false;
    $why.textContent = "카메라가 준비됐습니다. start를 눌러 주세요.";
  });
  video.size(W, H);
  video.hide();

  textFont("Pretendard, Apple SD Gothic Neo, Noto Sans KR, sans-serif");
}

function gotFaces(results) { faces = results; }

$start.onclick = () => {
  if (running || !video) return;
  faceMesh.detectStart(video, gotFaces);
  running = true;
  state = "searching";
  $start.disabled = true;
  $stop.disabled = false;
};

$stop.onclick = () => {
  if (!running) return;
  faceMesh.detectStop();
  running = false;
  faces = [];
  noseY = null;
  state = "idle";
  $start.disabled = false;
  $stop.disabled = true;
};

function draw() {
  background(14, 11, 36);

  // 거울처럼 좌우를 뒤집어 보여 줍니다.
  push();
  translate(W, 0);
  scale(-1, 1);
  if (video) image(video, 0, 0, W, H);
  pop();

  const midY = H / 2;

  // 기준선
  drawingContext.setLineDash([7, 7]);
  stroke(239, 231, 218, 110);
  strokeWeight(1);
  line(0, midY, W, midY);
  drawingContext.setLineDash([]);

  if (running && faces.length > 0) {
    const face = faces[0];

    // 얼굴 윤곽 점
    noStroke();
    fill(239, 231, 218, 55);
    for (let i = 0; i < face.keypoints.length; i += 6) {
      const k = face.keypoints[i];
      circle(W - k.x, k.y, 2);
    }

    const nose = face.keypoints[NOSE_TIP];
    noseY = nose.y;
    const nx = W - nose.x;

    if (noseY > midY + DEAD_ZONE)      state = "asleep";
    else if (noseY < midY - DEAD_ZONE) state = "awake";
    // 그 사이에서는 직전 상태를 유지합니다.

    const c = state === "asleep" ? color(126, 111, 208) : color(243, 178, 60);

    stroke(c); strokeWeight(1.5); noFill();
    circle(nx, noseY, 26);
    noStroke(); fill(c);
    circle(nx, noseY, 9);

    // 코와 기준선 사이의 거리
    stroke(c); strokeWeight(1);
    line(nx, noseY, nx, midY);
    noStroke(); fill(c);
    textSize(12);
    textAlign(LEFT, CENTER);
    text(`${round(noseY - midY)}px`, nx + 18, (noseY + midY) / 2);
  } else if (running) {
    state = "searching";
    noseY = null;
  }

  paintPanel();
}

function paintPanel() {
  const dy = noseY === null ? 0 : constrain((noseY - H / 2) / (H / 2), -1, 1);
  $dot.style.top = `${50 + dy * 46}%`;

  $readout.classList.toggle("is-awake",  state === "awake");
  $readout.classList.toggle("is-asleep", state === "asleep");

  if (state === "asleep") {
    $state.textContent = "자고 있습니다.";
    $why.textContent = "코가 중앙선 아래에 있습니다.";
  } else if (state === "awake") {
    $state.textContent = "깨어있습니다.";
    $why.textContent = "코가 중앙선 위에 있습니다.";
  } else if (state === "searching") {
    $state.textContent = "얼굴을 찾는 중";
    $why.textContent = "얼굴 전체가 화면에 들어오게 앉아 주세요.";
  } else {
    $state.textContent = "대기 중";
    $why.textContent = "start를 누르면 얼굴을 찾기 시작합니다.";
  }
}
</script>
</body>
</html>
